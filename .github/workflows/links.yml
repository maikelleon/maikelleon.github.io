name: Check for broken links

on:
  workflow_dispatch:
  schedule:
    - cron: "41 12 2 * *"   # 2nd of every month

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links
        run: |
          python scripts/check_links.py
          cat links-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open an issue if links are broken
        if: hashFiles('broken.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Broken links found on the site" --body-file broken.md
