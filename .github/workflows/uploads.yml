name: Replace headshot or CV

on:
  push:
    paths:
      - "uploads/**"
      - "!uploads/README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install pillow pillow-heif
          if ls uploads/*.doc* >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer
          fi
      - name: Process uploads
        run: python scripts/process_uploads.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save changes
        run: |
          git config user.name "site-updater"
          git config user.email "site-updater@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Replace headshot/CV" && git push)
