name: Update publications and metrics

on:
  workflow_dispatch:        # the "Run workflow" button
  schedule:
    - cron: "17 11 1 * *"   # also runs on the 1st of every month

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull from ORCID, OpenAlex and Google Scholar
        run: python scripts/update.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save changes
        run: |
          git config user.name "site-updater"
          git config user.email "site-updater@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Update publications and metrics"
            git push
          fi
